name: Update TLE Data

on:
  schedule:
    # Esegui ogni 3 ore (0, 3, 6, 9, 12, 15, 18, 21 UTC)
    - cron: '0 */3 * * *'
  # Permetti il trigger manuale da GitHub Actions
  workflow_dispatch:

jobs:
  update-tle:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      - name: Download TLE Data
        run: |
          # Scarica in un file temporaneo: data/active.tle non viene toccato finché
          # tutti i controlli non passano, così il sito continua a usare i dati buoni
          curl -sL "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle" \
            -H "User-Agent: Mozilla/5.0 (compatible; satellite-tracker/1.0)" \
            -o data/active.tle.tmp

          FILE_SIZE=$(wc -c < data/active.tle.tmp)
          echo "File size: ${FILE_SIZE} bytes"
          echo "Number of lines: $(wc -l < data/active.tle.tmp) lines"

          # Controlla se il server ha risposto con un messaggio di errore noto
          if grep -q "GP data has not updated" data/active.tle.tmp; then
            echo "Errore: CelesTrak ha risposto con 'GP data has not updated'."
            echo "I dati attuali rimangono invariati. Nessun commit verrà eseguito."
            exit 1
          fi

          # Fallisce se il file è più piccolo di 10KB (dati parziali o errore server)
          if [ "${FILE_SIZE}" -lt 10240 ]; then
            echo "Errore: file TLE scaricato troppo piccolo (${FILE_SIZE} bytes < 10KB)!"
            echo "Contenuto del file:"
            cat data/active.tle.tmp
            exit 1
          fi

          # Tutti i controlli superati: sostituisce il file buono
          mv data/active.tle.tmp data/active.tle
          echo "✓ TLE data scaricato e verificato con successo"
      
      - name: Check for Changes
        id: check_changes
        run: |
          if git diff --quiet data/active.tle; then
            echo "No changes detected in TLE data"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in TLE data"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Aggiungi il file modificato
          git add data/active.tle
          
          # Crea il commit con timestamp
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          git commit -m "chore: auto-update TLE data ($TIMESTAMP)"
          
          # Push to main branch
          git push
      
      - name: Notify if No Changes
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ TLE data è già aggiornato. Nessun commit necessario."
